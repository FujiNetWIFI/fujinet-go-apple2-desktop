# Builds the shared core and every frontend the runner's platform supports,
# then runs the test suite.
#
# The jobs deliberately do nothing to prepare the tree beyond checking it
# out: the build fetches its pinned dependencies (AppleWin, the FujiNet
# firmware), stages and patches the AppleWin tree, and builds the FujiNet
# runtime itself -- so CI exercises exactly what someone cloning the
# repository gets. If that promise ever breaks, these jobs are what notices.
#
# The macOS and Windows jobs are the substitute for owning those machines.
# Windows now builds the native Win32 frontend and packages it; macOS still
# builds only the core and the FujiNet runtime, until the AppKit frontend
# lands. That is the part with real portability risk, and it is where these
# jobs have already paid for themselves: getting Windows green needed a
# <cstring> include AppleWin was missing, a setenv() shim, and not building
# the Win32-on-POSIX shim on Win32. Nothing had ever compiled AppleWin's
# libretro frontend for MinGW before.
#
# The flatpak job is the strictest test of the clone-and-build promise: the
# sandbox has no network during the build, so anything the manifest does not
# declare is simply absent.
#
# EVERYTHING THIS WORKFLOW UPLOADS IS BUILT ROM-LESS (WITH_APPLE_ROMS=OFF).
# The Apple II system ROMs are Apple copyrighted firmware; the packaging
# path must fail safe, so the option's default is inverted here relative to
# CMakeLists.txt. The linux job covers the ROMs-embedded build. The release
# job attaches only these artifacts. See COMPLIANCE.md.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-4-dev libadwaita-1-dev \
            libwebkitgtk-6.0-dev qt6-base-dev qt6-webengine-dev \
            libssl-dev libexpat1-dev zlib1g-dev libkrb5-dev libgnutls28-dev \
            libboost-dev python3-venv python3-yaml python3-jinja2 \
            desktop-file-utils
      # SDL 3.4 aborts its configure when an X11 extension it enables by
      # default has no headers (3.2 quietly disabled them), so name the whole
      # set rather than depend on what the runner image happens to ship.
      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev
      - name: Build and install SDL3
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-src/build
          sudo cmake --install sdl3-src/build
      # No dependency preparation: this is the plain user path. The build
      # fetches AppleWin + the FujiNet firmware and builds libfujinet.so.
      # (Ubuntu's mbedTLS is 2.x, so the FujiNet build compiles the pinned
      # 3.6.5 for itself.)
      - name: Configure
        run: cmake -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the FujiNet runtime was built and exports its entry points
        run: |
          LIB=tools/fujinet/work/out/libfujinet.so
          test -f "$LIB" || { echo "::error::$LIB missing"; exit 1; }
          nm -D --defined-only "$LIB" | grep -q fujinet_desktop_start_runtime \
            || { echo "::error::entry points not exported"; exit 1; }
      # `cmake --install` is not otherwise exercised by anything, and it is
      # easy to break silently: it references the rendered icon set and the
      # desktop/AppStream files, none of which the build itself touches. It
      # WAS broken -- the icons did not exist -- and nothing noticed.
      - name: Verify the install rules
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/inst"
          for f in \
            share/applications/online.fujinet.go.apple2.gnome.desktop \
            share/applications/online.fujinet.go.apple2.kde.desktop \
            share/metainfo/online.fujinet.go.apple2.gnome.metainfo.xml \
            share/icons/hicolor/256x256/apps/online.fujinet.go.apple2.gnome.png \
            share/fujinet-go-apple2/symbols/APPLE2E.SYM \
            bin/fujinet-go-apple2-gnome; do
            test -e "$RUNNER_TEMP/inst/$f" \
              || { echo "::error::$f was not installed"; exit 1; }
          done

      # The redistributable configuration. Its own test suite includes
      # no_embedded_roms, which greps the binary for a slice of every firmware
      # image in the staged tree -- so "this build carries no Apple ROMs" is
      # checked rather than asserted. See COMPLIANCE.md.
      - name: Build and test the ROM-less configuration
        run: |
          cmake -B build-noroms -G Ninja -DWITH_APPLE_ROMS=OFF \
            -DWITH_FUJINET=OFF -DFRONTEND=none
          cmake --build build-noroms
          ctest --test-dir build-noroms --output-on-failure

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja boost
      # SDL3 is linked STATICALLY on macOS so anything shipped has no
      # Homebrew (or other non-system) library dependencies -- a bundle that
      # links /opt/homebrew paths only launches on machines that happen to
      # have that formula installed.
      - name: Build and install static SDL3
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl3-src/build
          sudo cmake --install sdl3-src/build
      # This job is the only machine that ever compiles the AppKit frontend.
      # (Homebrew's mbedTLS is 4.x, which drops the legacy headers FujiNet
      # includes, so the FujiNet build compiles the pinned 3.6.5 for itself.)
      #
      # ROM-LESS on purpose: the bundle is uploaded and then attached to
      # releases. See the note at the top of this file and COMPLIANCE.md.
      - name: Configure
        run: cmake -B build -G Ninja -DFRONTEND=macos -DWITH_APPLE_ROMS=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the FujiNet runtime was built and exports its entry points
        run: |
          LIB=tools/fujinet/work/out/libfujinet.dylib
          test -f "$LIB" || { echo "::error::$LIB missing"; exit 1; }
          nm -gU "$LIB" | grep -q _fujinet_desktop_start_runtime \
            || { echo "::error::entry points not exported"; exit 1; }
      # Every Mach-O that would ship must depend only on system libraries: a
      # bundle that links /opt/homebrew paths only launches on machines that
      # happen to have that formula installed. Checked across the whole
      # bundle, not just the dylib -- the executable links SDL3 and Boost too.
      - name: Verify the app bundle is self-contained
        run: |
          APP="build/frontends/macos/FujiNet Go Apple II.app"
          test -d "$APP" || { echo "::error::$APP missing"; exit 1; }
          fail=0
          while IFS= read -r macho; do
            echo "--- $macho ---"
            otool -L "$macho" | tail -n +2
            if otool -L "$macho" | tail -n +2 \
                 | grep -E "/opt/homebrew|/usr/local"; then
              echo "::error::non-system library leaked into $macho"
              fail=1
            fi
          done < <(find "$APP" -type f -perm +111 -exec sh -c \
                     'file -b "$1" | grep -q Mach-O && echo "$1"' _ {} \;)
          exit $fail
      # ditto preserves the executable bits and bundle structure that a plain
      # artifact upload of a .app directory does not.
      #
      # NOTE: the bundle is UNSIGNED. Gatekeeper will block it on first
      # launch until it is opened from the right-click menu. Signing and
      # notarisation need an Apple Developer identity in the repository
      # secrets; wire them in here when one exists (see the equivalent step
      # in fujinet-go-adam-desktop).
      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            "build/frontends/macos/FujiNet Go Apple II.app" \
            FujiNet-Go-Apple2-macos.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Apple2-macos
          path: FujiNet-Go-Apple2-macos.zip

  windows:
    runs-on: windows-latest
    # Required, not advisory. Neither AppleWin's libretro frontend nor
    # FujiNet's IWM device tree had ever been compiled for MinGW before this
    # repository did it; now that they build and pass, a regression here is a
    # real regression and should fail the branch.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-python-jinja
            mingw-w64-ucrt-x86_64-mbedtls
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-nsis
      # Static SDL3 (as on macOS) so nothing shipped needs a loose DLL --
      # not even SDL3.dll or the MinGW runtime.
      - name: Build and install static SDL3
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl3-src
          cmake -S sdl3-src -B sdl3-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build sdl3-src/build
          cmake --install sdl3-src/build
      # This is the job with the real portability risk: neither AppleWin's
      # libretro frontend nor FujiNet's IWM device tree (lib/device/iwm,
      # lib/bus/iwm) had ever been built under MinGW before this repository
      # did it. Before reaching here, Windows changes are cross-compiled with
      # cmake/toolchains/mingw-w64.cmake and smoke-tested under wine.
      #
      # ROM-LESS on purpose: this job's output is uploaded and then attached
      # to releases, and the Apple II system ROMs are Apple copyrighted
      # firmware that must not be redistributed. The app ships the
      # "Import System ROMs..." path for the user to supply their own. The
      # linux job covers the WITH_APPLE_ROMS=ON build. See COMPLIANCE.md.
      - name: Configure
        run: cmake -B build -G Ninja -DFRONTEND=windows -DWITH_APPLE_ROMS=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify the FujiNet DLL was built and exports its entry points
        run: |
          DLL=tools/fujinet/work/out/fujinet.dll
          test -f "$DLL" || { echo "::error::$DLL missing"; exit 1; }
          objdump -p "$DLL" | grep -q fujinet_desktop_start_runtime \
            || { echo "::error::entry points not exported"; exit 1; }
      # Checked by IMPORT TABLE rather than by ldd: ldd resolves against the
      # build machine's PATH, where the MSYS copies exist, so it reports a
      # dependency as satisfied that the target will not have. On the ADAM
      # target fujinet.dll shipped importing libcrypto-3-x64.dll and zlib1.dll
      # exactly this way -- the exe launched, LoadLibrary failed, and the
      # machine quietly ran with no FujiNet and no error anyone could see.
      - name: Verify the shipped binaries are self-contained
        run: |
          fail=0
          for bin in build/frontends/windows/fujinet-go-apple2-windows.exe \
                     tools/fujinet/work/out/fujinet.dll; do
            test -f "$bin" || { echo "::error::$bin missing"; exit 1; }
            echo "--- $bin imports ---"
            imports=$(objdump -p "$bin" | sed -n 's/^\s*DLL Name: //p' | sort -u)
            echo "$imports"
            bad=$(echo "$imports" | grep -ivE \
              '^(api-ms-win-[a-z0-9el-]+|kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|comctl32|comdlg32|imm32|winmm|version|setupapi|dwmapi|ws2_32|wsock32|iphlpapi|bcrypt|crypt32|secur32|netapi32|userenv|dbghelp|shlwapi|msvcrt|ucrtbase|rpcrt4|winspool|uxtheme|hid|cfgmgr32|powrprof|avrt|dxgi|d3d11|opengl32)\.dll$' \
              || true)
            if [ -n "$bad" ]; then
              echo "::error::$bin imports non-system DLLs that are not shipped:"
              echo "$bad"
              fail=1
            fi
          done
          exit $fail
      # The artifact is the folder you copy and run: the exe, fujinet.dll
      # beside it (where the session looks first), and the pristine FujiNet
      # runtime tree it provisions from on first start.
      - name: Stage the app folder
        run: |
          mkdir -p dist/FujiNet-Go-Apple2/fujinet
          cp build/frontends/windows/fujinet-go-apple2-windows.exe \
             dist/FujiNet-Go-Apple2/
          cp tools/fujinet/work/out/fujinet.dll dist/FujiNet-Go-Apple2/
          cp tools/fujinet/work/out/fnconfig.ini dist/FujiNet-Go-Apple2/fujinet/
          cp -r tools/fujinet/work/out/data tools/fujinet/work/out/SD \
             dist/FujiNet-Go-Apple2/fujinet/
      - name: Upload app folder
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Apple2-windows
          path: dist/FujiNet-Go-Apple2
      # The installer packages the folder staged above, so the two Windows
      # downloads are the same bits: one for people who want a Start Menu
      # entry and an uninstaller, one for portable use.
      - name: Build the installer
        run: |
          version=$(sed -n 's/^project(.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          makensis -V2 \
            -DVERSION="$version" \
            -DSRCDIR="$(cygpath -w "$PWD/dist/FujiNet-Go-Apple2")" \
            -DOUTFILE="$(cygpath -w "$PWD/dist/FujiNet-Go-Apple2-Setup.exe")" \
            -DAPPICON="$(cygpath -w "$PWD/frontends/windows/app.ico")" \
            build-aux/windows/installer.nsi
          test -f dist/FujiNet-Go-Apple2-Setup.exe \
            || { echo "::error::installer not produced"; exit 1; }
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: FujiNet-Go-Apple2-windows-installer
          path: dist/FujiNet-Go-Apple2-Setup.exe

  flatpak:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: gnome
            runtime: org.gnome.Platform
            sdk: org.gnome.Sdk
            version: '49'
          - frontend: kde
            runtime: org.kde.Platform
            sdk: org.kde.Sdk
            version: '6.11'
    steps:
      - uses: actions/checkout@v5
      # flatpak-builder is driven directly rather than through the community
      # container action, whose tags stop at gnome-47.
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
      - name: Install the runtime
        run: |
          flatpak install --user -y flathub \
            ${{ matrix.runtime }}//${{ matrix.version }} \
            ${{ matrix.sdk }}//${{ matrix.version }}
      # --disable-rofiles-fuse because FUSE is not available to the runner
      # user. No preparation of the tree: the manifest declares every input,
      # including the pinned AppleWin and FujiNet sources.
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build-flatpak \
            build-aux/flatpak/online.fujinet.go.apple2.${{ matrix.frontend }}.yml
      - name: Bundle
        run: |
          flatpak build-bundle repo \
            fujinet-go-apple2-${{ matrix.frontend }}.flatpak \
            online.fujinet.go.apple2.${{ matrix.frontend }}
      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: fujinet-go-apple2-${{ matrix.frontend }}-flatpak
          path: fujinet-go-apple2-${{ matrix.frontend }}.flatpak

  # Publishing. Runs only for v* tags, and only once every platform has built
  # and tested: the release carries exactly the binaries CI verified.
  #
  # Every artifact assembled here is built ROM-LESS -- see the WITH_APPLE_ROMS
  # notes in the windows job and the flatpak manifests, and COMPLIANCE.md.
  # Nothing published from this repository contains Apple firmware.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # The version lives in CMakeLists.txt and the AppStream metainfo (which
      # is where release notes belong). A tag that disagrees with them would
      # ship packages whose About box contradicts the download, so stop here
      # instead -- delete the tag, fix the version, tag again.
      - name: Check the tag matches the declared version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          project=$(sed -n 's/^project(.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag but CMakeLists.txt says $project"
            exit 1
          fi
          for m in frontends/*/data/*.metainfo.xml; do
            if ! grep -q "<release version=\"$tag\"" "$m"; then
              echo "::error::$m has no <release version=\"$tag\"> entry"
              exit 1
            fi
          done
          echo "version $tag agrees across CMakeLists.txt and the metainfo"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # download-artifact unpacks each artifact into its own directory, so
      # the folder-shaped Windows one is re-zipped for the release page.
      - name: Assemble release assets
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          mkdir -p release
          (cd artifacts/FujiNet-Go-Apple2-windows \
           && zip -qr "../../release/FujiNet-Go-Apple2-${tag}-windows.zip" .)
          cp "artifacts/FujiNet-Go-Apple2-macos/FujiNet-Go-Apple2-macos.zip" \
             "release/FujiNet-Go-Apple2-${tag}-macos.zip"
          cp "artifacts/FujiNet-Go-Apple2-windows-installer/FujiNet-Go-Apple2-Setup.exe" \
             "release/FujiNet-Go-Apple2-${tag}-windows-setup.exe"
          cp "artifacts/fujinet-go-apple2-gnome-flatpak/fujinet-go-apple2-gnome.flatpak" \
             "release/FujiNet-Go-Apple2-${tag}-gnome.flatpak"
          cp "artifacts/fujinet-go-apple2-kde-flatpak/fujinet-go-apple2-kde.flatpak" \
             "release/FujiNet-Go-Apple2-${tag}-kde.flatpak"
          ls -l release
      # Creates the release when the tag was pushed on its own (as a draft, so
      # the notes can be written before it goes out); when the release already
      # exists -- made in the web UI -- it is left alone and only the assets
      # are attached.
      - name: Publish the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --generate-notes \
              --title "FujiNet Go Apple II $tag"
          fi
          gh release upload "$tag" release/* --clobber
